<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order confirmed — REGALO</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#211a17">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500&family=Tenor+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=24">
  <script src="js/i18n.js?v=15"></script>
</head>
<body>
  <script src="js/layout.js?v=12"></script>
  <script>Regalo.checkoutHeader()</script>

  <main id="main" class="confirm">
    <h1 class="display-l"><span class="split-line"><span>Thank you for your order.</span></span></h1>
    <p class="body-l secondary" data-reveal style="--d:.2s">Order <span data-order>REG-1024</span>&nbsp;&nbsp;·&nbsp;&nbsp;A confirmation has been sent to your email address.</p>
    <div class="steps" data-stagger>
      <div class="steps__item" data-reveal><p class="eyebrow muted">01</p><p class="h4">Confirmation by email</p></div>
      <div class="steps__item" data-reveal><p class="eyebrow muted">02</p><p class="h4">Packed with care</p></div>
      <div class="steps__item" data-reveal><p class="eyebrow muted">03</p><p class="h4">On its way with tracking</p></div>
    </div>
    <div class="confirm__actions" data-reveal style="--d:.4s">
      <a class="btn btn--primary" href="collection.html"><span>Continue shopping</span></a>
      <a class="link" href="index.html"><span>Back to World of Regalo</span><i aria-hidden="true">→</i></a>
    </div>
  </main>

  <script>Regalo.footer()</script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/data.js?v=11"></script>
  <script src="js/main.js?v=24"></script>
</body>
</html>
